{% extends "base.html" %}
{% block title %}Edit Expense — Pocketlog{% endblock %}

{% block content %}
<section class="auth-section">
  <div class="auth-container">
    <div class="auth-header">
      <h1 class="auth-title">Edit expense</h1>
      <p class="auth-subtitle">Update this transaction</p>
    </div>

    <div class="auth-card">
      {% if error %}
      <div class="auth-error">{{ error }}</div>
      {% endif %}

      <form method="POST">
        <div class="form-group">
          <label for="amount">Amount</label>
          <input type="number" id="amount" name="amount" step="0.01" min="0.01"
                 class="form-input" placeholder="0.00"
                 value="{{ form.amount if form else '%.2f'|format(expense.amount) }}" required autofocus>
        </div>
        <div class="form-group">
          <label for="category">Category</label>
          <select id="category" name="category" class="form-input" required>
            <option value="" disabled>Select a category</option>
            {% for cat in categories %}
            <option value="{{ cat }}"
              {% if (form and form.category == cat) or (not form and expense.category == cat) %}selected{% endif %}>
              {{ cat }}
            </option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label for="date">Date</label>
          <input type="date" id="date" name="date"
                 class="form-input"
                 value="{{ form.date if form else expense.date }}" required>
        </div>
        <div class="form-group">
          <label for="description">Description <span class="text-muted">(optional)</span></label>
          <input type="text" id="description" name="description"
                 class="form-input" placeholder="e.g. Lunch at cafe"
                 value="{{ form.description if form else (expense.description or '') }}">
        </div>
        <button type="submit" class="btn-submit">Save changes</button>
      </form>
    </div>

    <p class="auth-switch">
      <a href="{{ url_for('profile') }}">← Back to profile</a>
    </p>
  </div>
</section>
{% endblock %}
